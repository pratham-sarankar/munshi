name: Flutter Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch so stale pushes don't block
# newer commits from being checked.
concurrency:
  group: flutter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Flutter tests
    runs-on: ubuntu-latest

    steps:
      - name: 🧹 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 🧪 Run tests
        # --no-pub   → skip a second pub get; we already ran it above
        # --reporter expanded → print every test name so failures are easy to spot in the log
        run: flutter test --no-pub --reporter expanded
